      children:
        - file: topics/foundations/performance-model/README.md
        - file: topics/foundations/performance-model/lab.ipynb
    - title: 工作约定
      children:
        - file: projects/README.md
        - file: STYLE.md
        - file: AGENTS.md
  exclude:
    - templates/**
    - inbox/**
    - '**/.runs/**'
site:
  template: book-theme
  options:
    logo_text: AI Infra Learning
    folders: true
    style: assets/styles/site.css
